name: Build OpenWRT packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  check-version:
    name: Check version match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check version match
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"

          if ! printf '%s\n' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(_rc[0-9]+)?$'; then
            echo "Error: Unsupported release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          JUSTCLASH_VERSION=$(grep '^PKG_VERSION:=' justclash/Makefile | cut -d '=' -f 2)
          LUCI_APP_JUSTCLASH_VERSION=$(grep '^PKG_VERSION:=' luci-app-justclash/Makefile | cut -d '=' -f 2)

          echo "Justclash: $JUSTCLASH_VERSION"
          echo "Luci-app-justclash: $LUCI_APP_JUSTCLASH_VERSION"
          echo "Pushed tag: $TAG_VERSION"

          if [ "$JUSTCLASH_VERSION" != "$TAG_VERSION" ] || [ "$LUCI_APP_JUSTCLASH_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch. Release build cancelled."
            exit 1
          fi

  build:
    name: Build justclash ${{ matrix.type }}
    runs-on: ubuntu-latest
    needs: check-version
    strategy:
      matrix:
        include:
          - { type: ipk }
          - { type: apk }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.type }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ./Dockerfile-${{ matrix.type }}
          context: .
          tags: justclash/build:${{ matrix.type }}
          cache-from: type=gha,scope=build-${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.type }}
          load: true

      - name: Create ${{ matrix.type }} Docker container
        run: docker create --name ${{ matrix.type }} justclash/build:${{ matrix.type }}

      - name: Copy files from ${{ matrix.type }} Docker container
        run: |
          mkdir -p ./output/${{ matrix.type }}
          rm -f ./output/${{ matrix.type }}/*.${{ matrix.type }} || true
          docker cp ${{ matrix.type }}:/builder/bin/packages/x86_64/utilities/. ./output/${{ matrix.type }}/
          docker cp ${{ matrix.type }}:/builder/bin/packages/x86_64/luci/. ./output/${{ matrix.type }}/
          if [ "${{ matrix.type }}" = "snapshot" ]; then
            rm -rf ./output/${{ matrix.type }}/tmp || true
          fi

      - name: Rename all output packages (replace _ with -)
        if: matrix.type == 'ipk'
        shell: bash
        run: |
          for f in ./output/${{ matrix.type }}/*.ipk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed 's/_/-/g')
            mv "$f" "./output/${{ matrix.type }}/$newname"
          done

      - name: Renaming translation file
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv ./output/${{ matrix.type }}/luci-i18n-justclash-ru-*.${{ matrix.type }} "./output/${{ matrix.type }}/luci-i18n-justclash-ru-${VERSION}.${{ matrix.type }}"
          mv ./output/${{ matrix.type }}/luci-i18n-justclash-zh-*.${{ matrix.type }} "./output/${{ matrix.type }}/luci-i18n-justclash-zh-${VERSION}.${{ matrix.type }}"

      - name: Remove Docker ${{ matrix.type }} container
        run: docker rm ${{ matrix.type }}

      - name: Filter required files
        shell: bash
        run: |
          mkdir -p ./output/filtered/${{ matrix.type }}
          cp ./output/${{ matrix.type }}/luci-i18n-justclash-zh-*.${{ matrix.type }} ./output/filtered/${{ matrix.type }}/
          cp ./output/${{ matrix.type }}/luci-i18n-justclash-ru-*.${{ matrix.type }} ./output/filtered/${{ matrix.type }}/
          cp ./output/${{ matrix.type }}/justclash-*.${{ matrix.type }} ./output/filtered/${{ matrix.type }}/
          cp ./output/${{ matrix.type }}/luci-app-justclash-*.${{ matrix.type }} ./output/filtered/${{ matrix.type }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files-${{ github.ref_name }}-${{ matrix.type }}
          path: ./output/filtered/${{ matrix.type }}/*.${{ matrix.type }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release dir
        run: mkdir -p ./output/release

      - name: Download ipk artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files-${{ github.ref_name }}-ipk
          path: ./output/release

      - name: Download apk artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files-${{ github.ref_name }}-apk
          path: ./output/release

      - name: Extract changelog for current version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk '/## \['"$VERSION"'\]/ {flag=1} /^## \[/ {if(flag && !/## \['"$VERSION"'\]/) exit} flag' ./RELEASENOTES.md > ./tmp.md

      - name: Generate SHA256SUMS
        run: |
          cd ./output/release
          sha256sum *.ipk *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ./output/release/*.ipk
            ./output/release/*.apk
            ./output/release/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: ./tmp.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '_rc') }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
